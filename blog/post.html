<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title id="page-title">Game Development Article | Griffin Dalby</title>
    <meta name="description" content="Technical articles by Griffin Dalby on Roblox game development, networking, physics, and systems engineering.">
    <meta name="author" content="Griffin Dalby">
    <link rel="canonical" href="https://griffin-dalby.github.io/portfolio/blog/post.html">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Griffin Dalby">
    <meta property="og:title" content="Game Development Article | Griffin Dalby">
    <meta property="og:description" content="Technical articles by Griffin Dalby on Roblox game development, networking, physics, and systems engineering.">
    <meta property="og:url" content="https://griffin-dalby.github.io/portfolio/blog/post.html">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Game Development Article | Griffin Dalby">
    <meta name="twitter:description" content="Technical articles by Griffin Dalby on Roblox game development, networking, physics, and systems engineering.">
    <link rel="stylesheet" href="../css/blog.css">
</head>
<body style="background-color: #151515;">
        <nav class="blog-nav">
            <a href="/portfolio/blog/" class="back-link">← Back to Blog</a>
            <a href="/portfolio/" class="home-link">Home</a>
        </nav>

        <article class="post-container">
            <header class="post-header">
                <h1 id="post-title"></h1>
                <time id="post-date"></time>
            </header>
            
            <div id="post-content" class="markdown-content"></div>
        </article>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search)
        const postFile = params.get('file')

        if (!postFile) {
            window.location.href = '/portfolio/blog/'
        }

        async function loadPost() {
            try {
                const response = await fetch(`posts/${postFile}.md`)
                if (!response.ok) throw new Error('Post not found')
                
                const markdown = await response.text()
                const rawHtml = marked.parse(markdown)
                const sanitizedHtml = DOMPurify.sanitize(rawHtml)
                
                document.getElementById('post-content').innerHTML = sanitizedHtml
                
                const firstHeading = document.querySelector('#post-content h1')
                if (firstHeading) {
                    const title = firstHeading.textContent
                    document.getElementById('post-title').textContent = title
                    document.getElementById('page-title').textContent = `${title} - Griffin Dalby`
                    firstHeading.remove()
                }
                
                await loadPostMetadata()
                
            } catch (error) {
                document.getElementById('post-content').innerHTML = 
                    `<p class="error">Failed to load post: ${error.message}</p>`
            }
        }

        async function loadPostMetadata() {
            try {
                const response = await fetch('posts.json')
                const posts = await response.json()
                const currentPost = posts.find(p => p.file === postFile)
                
                if (currentPost) {
                    const dateElement = document.getElementById('post-date')
                    dateElement.textContent = `${currentPost.date} • Griffin Dalby`

                    const title = document.getElementById('post-title').textContent || currentPost.title
                    const description = currentPost.description
                    const postUrl = new URL('post.html', window.location.href)
                    postUrl.searchParams.set('file', postFile)

                    document.getElementById('page-title').textContent = `${title} | Griffin Dalby`
                    document.querySelector('link[rel="canonical"]').href = postUrl.href
                    document.querySelector('meta[name="description"]').content = description
                    document.querySelector('meta[property="og:title"]').content = `${title} | Griffin Dalby`
                    document.querySelector('meta[property="og:description"]').content = description
                    document.querySelector('meta[property="og:url"]').content = postUrl.href
                    document.querySelector('meta[name="twitter:title"]').content = `${title} | Griffin Dalby`
                    document.querySelector('meta[name="twitter:description"]').content = description
                }
            } catch (error) {
                console.error('Failed to load metadata:', error)
            }
        }

        loadPost()
    </script>
</body>
</html>
